<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Built for every team that influences growth</title>
<style>
/* ============================================================
   Embedded typeface — Inter (latin subset, variable 100–900).
   Base64-inlined so the file is fully self-contained / offline.
   ============================================================ */
@font-face{
  font-family:'Inter';
  font-style:normal;
  font-weight:100 900;
  font-display:block;
  src:url(data:font/woff2;base64,__INTER_B64__) format('woff2');
}

/* ============================================================
   LAYOUT  ·  measured off the prototype
   The prototype is a plain two-column grid, and the numbers are
   exact: the top rule spans 1096, each column is 533 and the
   gutter is 30 — 533 + 30 + 533 = 1096. So the card's right edge
   lines up with the rule, and the section has equal margins.
   --u stays as the unit the fitted CSS is written in; at 1px every
   measurement below is the prototype's own pixel value.
   ============================================================ */
:root{
  --u: 1px;

  --container: 1096px;      /* rule span: x 25 -> 1121            */
  --gutter: 30px;           /* column 533 | 30 | column 533       */
  --card-aspect: 533 / 438; /* card box, y 83 -> 521              */
  --pad-x: 24px;            /* breathing room at narrow widths    */

  --bg-1:#fdfdfe;
  --bg-2:#f4f7fa;
  --bg-3:#edf2f7;
  --rule:#e3e6e9;
  --divider:#e5e8ea;
  --ink:#14171b;
  --ink-row:#16191d;
  --blue:#0b61d6;
  --muted:#6f7680;
  --marker:#3c4149;

  --grid:rgba(255,255,255,.20);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}

body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',
              'Helvetica Neue',Helvetica,Arial,sans-serif;
  background:linear-gradient(152deg,var(--bg-1) 0%,var(--bg-2) 56%,var(--bg-3) 100%);
  background-attachment:fixed;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  font-synthesis:none;
  min-height:100vh;
  display:flex;
  align-items:center;          /* centre the section, but let it scroll
                                  normally if the viewport is short */
}

/* ---- the section: centred, with equal margins on both sides ---- */
.stage{
  width:100%;
  max-width:calc(var(--container) + var(--pad-x) * 2);
  margin-inline:auto;
  padding:40px var(--pad-x);
}

/* named .split, not .row — .row is the accordion button class and its
   display:flex would win here on source order */
.split{
  margin-top:36px;             /* rule y45 -> content y81 */
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:var(--gutter);
  align-items:start;
}

/* ---- top hairline · spans the container · 1px #e3e6e9 ------- */
.rule{
  height:1px;
  background:var(--rule);
}

/* ---- left column ------------------------------------------- */
.col{min-width:0}

/* headline · 27px / 44px · w600 · tracking -0.60 · ink 25→324 */
.headline{
  flex:0 0 auto;
  font-size:calc(27 * var(--u));
  line-height:calc(44 * var(--u));
  font-weight:610;
  letter-spacing:calc(-0.60 * var(--u));
  color:var(--ink);
  white-space:nowrap;
  margin-left:calc(-2 * var(--u));   /* side-bearing compensation */
}
.headline .accent{color:var(--blue);display:block}

/* headline box bottom (167) → Product label box top (223.4) */
.spacer{flex:0 0 auto;height:calc(37.4 * var(--u))}

/* ============================================================
   ACCORDION · rules at 288 / 352.25 / 416.5 / 480.75 / 545
   ============================================================ */
.acc{display:flex;flex-direction:column}

/* Rows measured off the reference: 65px closed, 81px open, with the
   label's ink starting 23.5px below the row top in BOTH — so opening a
   row does not shift its own label. Because exactly one row is open,
   the accordion's total height is constant (4x65 + 81 = 341) and only
   the divider directly below the open row moves. */
.item{
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  padding-top:19px;                /* 19 + 4.5 ink offset = 23.5 */
  border-bottom:1px solid var(--divider);
}
.item:not(.open){height:65px}
.item.open{height:81px;padding-bottom:16px}

.row{
  display:flex;
  align-items:center;
  background:none;border:0;padding:0;width:100%;
  font:inherit;color:inherit;text-align:left;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.row:focus-visible{outline:calc(2*var(--u)) solid var(--blue);outline-offset:calc(3*var(--u))}

/* marker gutters: square → label at x48 · chevron → label at x50 */
/* One gutter width for both states. Previously the closed rows used a
   25px gutter with 7px of padding and the open row 23px with none, so
   the labels started at different x — the reference has them flush. */
.marker{
  flex:0 0 23px;
  height:16px;
  display:flex;
  align-items:center;
  padding-left:2.7px;                /* chevron indent, per the reference */
  margin-top:-4.6px;                 /* align glyph to the label cap-centre */
}
.item.open .marker{padding-left:0}   /* the square sits flush left */

/* both glyphs live in the DOM; CSS picks one, so opening a row is a class
   toggle rather than a DOM rebuild */
.marker svg{display:block;overflow:visible}
.marker .sq{width:calc(12 * var(--u));height:calc(12 * var(--u))}
.marker .cv{width:calc(6 * var(--u));height:calc(10 * var(--u))}
.marker rect{stroke:var(--blue);stroke-width:1.4}
.marker path{fill:var(--marker)}
.item .sq,.item.open .cv{display:none}
.item.open .sq{display:block}

/* row label · 16.5px / 21px · #16191d · ink from x 50 */
.label{
  font-size:calc(16.5 * var(--u));
  line-height:calc(21 * var(--u));
  font-weight:500;
  letter-spacing:calc(-0.08 * var(--u));
  color:var(--ink-row);
  transition:color .18s ease;
}
.item.open .label{color:var(--blue);font-weight:620}

/* description · 10.9px / 15px · #6f7680 · ink 25→288 */
.desc{
  font-size:calc(10.9 * var(--u));
  line-height:calc(15 * var(--u));
  font-weight:420;
  letter-spacing:calc(0.02 * var(--u));
  color:var(--muted);
  padding-top:calc(8.9 * var(--u));
  overflow:hidden;
}
.item:not(.open) .desc{display:none}

/* ============================================================
   RIGHT CARD · x 588→1146 (bleeds right) · y 83→521 · r 8
   ============================================================ */
.card{
  position:relative;
  aspect-ratio:var(--card-aspect);
  border-radius:8px;
  overflow:hidden;
  isolation:isolate;
  box-shadow:0 2px 16px rgba(16,32,56,.10);
}

/* ---- background: blurred-photograph mesh --------------------
   Modelled the way the original actually is: a grid of averaged
   colours put through one Gaussian blur. The grid was fitted by
   deconvolution against colours sampled from the reference, so the
   blur reproduces those samples rather than washing them out.
   preserveAspectRatio="none" lets it stretch with the card.
   ------------------------------------------------------------ */
.mesh{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;            /* card aspect may drift from the asset's */
}
.mesh-film{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.05) 0%,rgba(255,255,255,0) 32%,rgba(0,0,0,.045) 100%);
}

/* ---- dashed grid ------------------------------------------- */
.chart{position:absolute;inset:0;pointer-events:none}
.grid{position:absolute;inset:0;pointer-events:none}
.grid i{position:absolute}
.grid .h{left:0;right:0;height:0;border-top:max(1px,calc(1*var(--u))) dashed var(--grid)}
.grid .v{top:0;bottom:0;width:0;border-left:max(1px,calc(1*var(--u))) dashed rgba(255,255,255,.26)}
.grid .h1{top:8.904%}   /* y 39  of 438 */
.grid .h2{top:26.712%}  /* y 117        */
.grid .h3{top:44.521%}  /* y 195        */
.grid .h4{top:62.329%}  /* y 273        */
.grid .h5{top:80.137%}  /* y 351        */
.grid .h6{top:97.945%}  /* y 429        */
.grid .v1{left:11.470%} /* x 64  of 558 */

/* ---- chart ---------------------------------------------------
   Card is 533 x 438. Percentages below are of that box.

   The reference drives the whole chart from ONE value: the primary
   bar's top edge. Measured across all four states, the cap segment,
   the caption and the number sit at fixed offsets above it —
   20 / 40 / 62 px — so they ride along rather than animating
   separately. --bar-top is that value; everything else is calc()ed
   off it. The ghost bar is static in the reference and stays static
   here.
   ------------------------------------------------------------ */
.card{
  --bar-top: 33.99%;          /* Product, the default state        */
  --cap-h: 3.082%;            /* cap segment height, 13.5px        */
  --label-op: 1;              /* caption cross-fade                */
}

/* offsets above the bar top, as fractions of the 438px card height */
.chart{ --d-cap: 4.566%; --d-label: 9.938%; --d-stat: 15.630%; }

.bar-ghost,.bar-blue,.bar-cap{position:absolute}

/* Frosted glass. Alpha falls .58 -> .40 down the bar and the tint
   travels cool -> warm, following a backdrop that runs steel-blue at
   the top and cream at the floor; a single flat wash cannot match
   both ends. Stops fitted by render-measure-correct. */
.bar-ghost{
  left:29.831%;width:15.009%;top:54.110%;bottom:0;
  background:linear-gradient(180deg,
    rgba(228,241,255,0.58) 2.488%,
    rgba(216,227,235,0.44) 49.751%,
    rgba(249,250,246,0.40) 97.015%);
  -webkit-backdrop-filter:blur(2px) saturate(106%);
  backdrop-filter:blur(2px) saturate(106%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),
             inset 1px 0 0 rgba(255,255,255,.13);
}

/* Opaque, no outer bloom — the reference keeps these edges crisp. */
.bar-blue{
  left:54.409%;width:15.009%;
  top:var(--bar-top);bottom:0;
  background:linear-gradient(180deg,
    rgb(27,101,225) 2.768%,
    rgb(20,89,211) 33.910%,
    rgb(17,79,198) 65.052%,
    rgb(13,74,184) 97.924%);
  box-shadow:inset 1.2px 0 0 rgba(255,255,255,.10);
}

/* Nothing is drawn between cap and bar: the photograph shows through. */
.bar-cap{
  left:54.409%;width:15.009%;
  top:calc(var(--bar-top) - var(--d-cap));
  height:var(--cap-h);
  background:rgb(26,104,230);
  box-shadow:inset 1.2px 0 0 rgba(255,255,255,.12);
}

/* ---- chart typography ---------------------------------------
   Both right-aligned; their vertical position rides on --bar-top.
   ------------------------------------------------------------ */
.stat{
  position:absolute;
  right:31.20%;
  top:calc(var(--bar-top) - var(--d-stat));
  font-size:40px;
  line-height:42px;
  font-weight:500;
  letter-spacing:-3.0px;
  color:rgba(255,255,255,.93);
  text-shadow:0 1px 10px rgba(8,22,40,.34);
  white-space:nowrap;
  font-variant-numeric:tabular-nums;   /* digits must not jitter while counting */
}
.stat-label{
  position:absolute;
  right:48.50%;
  top:calc(var(--bar-top) - var(--d-label));
  font-size:12.3px;
  line-height:16px;
  font-weight:400;
  letter-spacing:0.04px;
  color:rgba(255,255,255,.95);
  text-shadow:0 1px 8px rgba(8,22,40,.40);
  white-space:nowrap;
  opacity:var(--label-op);
}

.sr-only{
  position:absolute;width:1px;height:1px;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;
}

/* ============================================================
   RESPONSIVE
   Desktop and laptop all land in the same place: the container
   caps at 1096 and centres, so the section keeps equal margins
   and the prototype's proportions at every width above it.
   Below that the columns narrow together, then stack.
   ============================================================ */

/* laptops under the container width: nothing special is needed —
   the grid narrows both columns equally and the card follows its
   aspect ratio, so the hierarchy is preserved. Just ease the type
   down a little so the headline keeps its two-line shape. */
@media (max-width: 1000px){
  .headline{font-size:calc(25 * var(--u));line-height:calc(40 * var(--u))}
  .spacer{height:calc(46 * var(--u))}
  .label{font-size:calc(15.5 * var(--u));line-height:calc(20 * var(--u))}
  .item:not(.open){height:58px}
}

/* stack: two 533-wide columns stop working well below roughly 900 */
@media (max-width: 860px){
  body{align-items:flex-start}
  .stage{padding:56px var(--pad-x)}
  .split{grid-template-columns:1fr;gap:40px}

  .headline{
    font-size:calc(30 * var(--u));
    line-height:calc(41 * var(--u));
    letter-spacing:calc(-0.5 * var(--u));
    white-space:normal;
  }
  .headline .accent{display:inline}
  .spacer{height:calc(34 * var(--u))}
  .item:not(.open){height:62px}
  .card{aspect-ratio:16 / 11}
}

@media (max-width: 520px){
  :root{--pad-x:20px}
  .headline{font-size:calc(27 * var(--u));line-height:calc(37 * var(--u))}
  .item:not(.open){height:58px}
  .label{font-size:calc(16 * var(--u))}
  .card{aspect-ratio:4 / 3}
  /* narrow card: stack the caption over the figure, both flush with
     the primary bar's right edge */
  .stat{right:33.692%;top:13%;font-size:calc(34 * var(--u));line-height:calc(36 * var(--u))}
  .stat-label{right:33.692%;top:5%;font-size:calc(12 * var(--u));line-height:calc(15 * var(--u))}
}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}
</style>
</head>
<body>

<main class="stage">

  <div class="rule" role="presentation"></div>

  <div class="split">

    <section class="col">
    <h1 class="headline">
      Built for every team that
      <span class="accent">influences&nbsp;growth.</span>
    </h1>

    <div class="spacer" aria-hidden="true"></div>

    <div class="acc">

      <div class="item open" data-bar-top="33.99%" data-value="32"
           data-caption="Higher expansion revenue">
        <button class="row" type="button" aria-expanded="true">
          <span class="marker" aria-hidden="true">
            <svg class="sq" viewBox="0 0 12 12" fill="none">
              <rect x=".7" y=".7" width="10.6" height="10.6" rx="1.4"/>
            </svg>
            <svg class="cv" viewBox="0 0 6 10" fill="none">
              <path d="M0 0 L6 5 L0 10 Z"/>
            </svg>
          </span>
          <span class="label">Product</span>
        </button>
        <p class="desc">Understand which features create loyal customers.</p>
      </div>

      <div class="item" data-bar-top="39.76%" data-value="41"
           data-caption="Faster time to first value">
        <button class="row" type="button" aria-expanded="false">
          <span class="marker" aria-hidden="true">
            <svg class="sq" viewBox="0 0 12 12" fill="none">
              <rect x=".7" y=".7" width="10.6" height="10.6" rx="1.4"/>
            </svg>
            <svg class="cv" viewBox="0 0 6 10" fill="none">
              <path d="M0 0 L6 5 L0 10 Z"/>
            </svg>
          </span>
          <span class="label">Growth</span>
        </button>
        <p class="desc">See which activation loops actually move revenue.</p>
      </div>

      <div class="item" data-bar-top="44.01%" data-value="27"
           data-caption="Larger average deal size">
        <button class="row" type="button" aria-expanded="false">
          <span class="marker" aria-hidden="true">
            <svg class="sq" viewBox="0 0 12 12" fill="none">
              <rect x=".7" y=".7" width="10.6" height="10.6" rx="1.4"/>
            </svg>
            <svg class="cv" viewBox="0 0 6 10" fill="none">
              <path d="M0 0 L6 5 L0 10 Z"/>
            </svg>
          </span>
          <span class="label">Sales</span>
        </button>
        <p class="desc">Walk into every call knowing what to pitch next.</p>
      </div>

      <div class="item" data-bar-top="50.38%" data-value="19"
           data-caption="Lower gross churn">
        <button class="row" type="button" aria-expanded="false">
          <span class="marker" aria-hidden="true">
            <svg class="sq" viewBox="0 0 12 12" fill="none">
              <rect x=".7" y=".7" width="10.6" height="10.6" rx="1.4"/>
            </svg>
            <svg class="cv" viewBox="0 0 6 10" fill="none">
              <path d="M0 0 L6 5 L0 10 Z"/>
            </svg>
          </span>
          <span class="label">Customer Success</span>
        </button>
        <p class="desc">Catch churn risk weeks before the renewal call.</p>
      </div>

      <div class="item" data-bar-top="46.60%" data-value="24"
           data-caption="Shorter planning cycles">
        <button class="row" type="button" aria-expanded="false">
          <span class="marker" aria-hidden="true">
            <svg class="sq" viewBox="0 0 12 12" fill="none">
              <rect x=".7" y=".7" width="10.6" height="10.6" rx="1.4"/>
            </svg>
            <svg class="cv" viewBox="0 0 6 10" fill="none">
              <path d="M0 0 L6 5 L0 10 Z"/>
            </svg>
          </span>
          <span class="label">Leadership</span>
        </button>
        <p class="desc">One number the whole company can steer by.</p>
      </div>

    </div>
  </section>

    <figure class="card">
    __MESH_SVG__
    <div class="mesh-film" aria-hidden="true"></div>

    <div class="grid" aria-hidden="true">
      <i class="h h1"></i><i class="h h2"></i><i class="h h3"></i>
      <i class="h h4"></i><i class="h h5"></i><i class="h h6"></i>
      <i class="v v1"></i>
    </div>

    <div class="chart" aria-hidden="true">
      <div class="bar-ghost"></div>
      <div class="bar-cap"></div>
      <div class="bar-blue"></div>
      <div class="stat-label">Higher expansion revenue</div>
      <div class="stat">32%</div>
    </div>

    <figcaption class="sr-only">
      Expansion revenue is 32% higher for teams using the product.
    </figcaption>
    </figure>

  </div>

</main>

<script>
/* ---------------------------------------------------------------
   Accordion + chart animation.

   Timings and easings below were measured frame by frame off the
   reference recording at 60fps, not chosen by feel:

     bar top    370ms  easeOutCubic  (rms 0.039 over three transitions;
                                      easeOutCubic beat every other named
                                      easing by more than 2x)
     number     800ms  easeOutQuad   (every one of nine digit steps lands
                                      within a frame of the measurement)
     caption    fades out over 160ms, swaps, fades back in 230-430ms
     cap        shrinks to nothing by 190ms, regrows 390-640ms

   The chart is driven by a single value, --bar-top. In the reference
   the cap, the caption and the number keep fixed offsets above the
   bar's top edge in all four states, so they are positioned off that
   one variable in CSS and ride along for free.
   --------------------------------------------------------------- */
(function () {
  var items = Array.prototype.slice.call(document.querySelectorAll('.item'));
  var card  = document.querySelector('.card');
  var statEl = document.querySelector('.stat');
  var labelEl = document.querySelector('.stat-label');
  if (!items.length || !card) return;

  var BAR_MS = 370, NUM_MS = 800;
  var OUT_MS = 160, IN_AT = 230, IN_MS = 200;
  var CAP_OUT = 190, CAP_AT = 390, CAP_IN = 250;
  var CAP_H = 3.082;                       // settled cap height, % of card

  var outCubic = function (t) { return 1 - Math.pow(1 - t, 3); };
  var outQuad  = function (t) { return 1 - Math.pow(1 - t, 2); };
  var clamp01  = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };
  var lerp     = function (a, b, t) { return a + (b - a) * t; };

  var read = function (el) {
    return {
      top: parseFloat(el.getAttribute('data-bar-top')),
      value: parseInt(el.getAttribute('data-value'), 10),
      caption: el.getAttribute('data-caption')
    };
  };

  var still = window.matchMedia('(prefers-reduced-motion: reduce)');
  var from = read(items[0]), to = from, raf = 0, swapped = true;

  var paint = function (top, value, capH, labelOp) {
    card.style.setProperty('--bar-top', top.toFixed(3) + '%');
    card.style.setProperty('--cap-h', capH.toFixed(3) + '%');
    card.style.setProperty('--label-op', labelOp.toFixed(3));
    statEl.textContent = Math.round(value) + '%';
  };

  var settle = function (st) {
    labelEl.textContent = st.caption;
    paint(st.top, st.value, CAP_H, 1);
  };

  var run = function (t0) {
    var step = function (now) {
      var e = now - t0;

      var top = lerp(from.top, to.top, outCubic(clamp01(e / BAR_MS)));
      var val = lerp(from.value, to.value, outQuad(clamp01(e / NUM_MS)));

      var op;
      if (e < OUT_MS)      op = 1 - outQuad(e / OUT_MS);
      else if (e < IN_AT)  op = 0;
      else                 op = outQuad(clamp01((e - IN_AT) / IN_MS));

      // swap the text while it is invisible
      if (!swapped && e >= OUT_MS) { labelEl.textContent = to.caption; swapped = true; }

      var capH;
      if (e < CAP_OUT)      capH = CAP_H * (1 - outQuad(e / CAP_OUT));
      else if (e < CAP_AT)  capH = 0;
      else                  capH = CAP_H * outCubic(clamp01((e - CAP_AT) / CAP_IN));

      paint(top, val, capH, op);

      if (e < Math.max(BAR_MS, NUM_MS, CAP_AT + CAP_IN, IN_AT + IN_MS)) {
        raf = requestAnimationFrame(step);
      } else {
        raf = 0; from = to; settle(to);
      }
    };
    raf = requestAnimationFrame(step);
  };

  var open = function (item) {
    items.forEach(function (other) {
      var is = other === item;
      other.classList.toggle('open', is);
      other.querySelector('.row').setAttribute('aria-expanded', String(is));
    });
    var next = read(item);
    if (next.top === to.top && next.value === to.value) return;
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    // resume from wherever the chart currently is, so rapid clicks stay smooth
    from = {
      top: parseFloat(card.style.getPropertyValue('--bar-top')) || from.top,
      value: parseInt(statEl.textContent, 10),
      caption: labelEl.textContent
    };
    to = next;
    if (still.matches) { settle(to); from = to; return; }
    swapped = false;
    run(performance.now());
  };

  items.forEach(function (item) {
    item.querySelector('.row').addEventListener('click', function () {
      if (!item.classList.contains('open')) open(item);
    });
  });

  settle(from);
})();
</script>

</body>
</html>
